<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>外观设置</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(1000px 500px at 20% -10%,#3a5a8f 0%,#22344f 60%),#22344f;background-attachment:fixed;color:#e2e8f0;max-width:640px;margin:0 auto;padding-bottom:24px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(13,20,36,.85);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
header a{color:#34d399;text-decoration:none;font-size:14px;white-space:nowrap}
header .tt{flex:1;font-size:16px;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px;margin:12px;backdrop-filter:blur(6px)}
.card h3{font-size:15px;color:#f1f5f9;margin-bottom:6px}
label{display:block;font-size:12px;color:#94a3b8;margin:12px 0 4px}
select,input[type=text]{width:100%;padding:9px;border:1px solid rgba(255,255,255,.15);border-radius:8px;font-size:14px;background:rgba(15,23,42,.6);color:#e2e8f0}
input[type=text]::placeholder{color:#64748b}
.range{display:flex;align-items:center;gap:10px;margin-top:2px}
.range input[type=range]{flex:1;accent-color:#34d399}
.range .v{width:38px;text-align:right;font-family:monospace;color:#34d399;font-size:13px}
.preview{margin-top:14px;height:110px;border-radius:12px;border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
.preview::before{content:'';position:absolute;inset:0;background:var(--pv,#22344f);background-size:cover;filter:blur(var(--pv-blur,0px))}
.preview .t{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.btn{width:100%;margin-top:14px;padding:11px;border:none;border-radius:10px;background:#2e7d32;color:#fff;font-size:15px;cursor:pointer}
.btn.secondary{background:#475569;margin-top:8px}
.hint{font-size:11.5px;color:#7c8aa5;margin-top:6px}
.toast{display:none;position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.12);color:#f1f5f9;padding:9px 18px;border-radius:22px;font-size:13px;z-index:99;max-width:82%}
</style>
</head>
<body>
<header>
<a href="/">← 返回</a>
<div class="tt">🎨 外观设置</div>
<button id="reset" style="background:rgba(255,255,255,.1);color:#cbd5e1;border:none;border-radius:14px;padding:6px 12px;font-size:12px;cursor:pointer">默认</button>
</header>

<div class="card">
<h3>背景</h3>
<label>背景类型</label>
<select id="bg_type">
<option value="gradient">深色渐变</option>
<option value="image">图片</option>
<option value="color">纯色</option>
<option value="light">浅色</option>
</select>
<label>背景值（本地上传或图片 URL / 颜色，如 #27406b）</label>
<input id="bg_value" type="text" placeholder="https://... 或 #ffffff"><div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><button type="button" id="up_btn" style="background:rgba(30,136,229,.15);color:#64b5f6;border:1px solid rgba(30,136,229,.4);border-radius:10px;padding:6px 12px;font-size:12px;cursor:pointer">📤 本地上传背景图片</button><span id="bg_file_info" style="font-size:12px;color:#94a3b8"></span><input id="bg_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none"></div><div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><input id="bg_url" type="text" placeholder="粘贴图片链接（App 内可用）" style="flex:1;min-width:140px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:6px 10px;color:#e2e8f0;font-size:12px"><button type="button" id="url_btn" style="background:rgba(76,175,80,.15);color:#81c784;border:1px solid rgba(76,175,80,.4);border-radius:10px;padding:6px 12px;font-size:12px;cursor:pointer">下载为背景</button></div>
<label>深浅度 <span style="color:#64748b">(0 最亮 / 100 最暗)</span></label>
<div class="range"><input id="bg_dark" type="range" min="0" max="100" value="55"><span class="v" id="dark_v">55</span></div>
<label>模糊 <span style="color:#64748b">(0 清晰 / 30 模糊)</span></label>
<div class="range"><input id="bg_blur" type="range" min="0" max="30" value="0"><span class="v" id="blur_v">0</span></div>
<div class="preview" id="pv"><div class="t">实时预览</div></div>
<button class="btn" id="save">保存外观</button>
<button class="btn secondary" id="apply">仅预览（不保存）</button>
<div class="hint">深浅度会同时影响背景亮暗；模糊只作用于背景，不影响文字。保存后所有设备生效。</div>
</div>

<div class="card">
<h3>卡片图标</h3>
<div class="hint" style="margin-top:2px">首页卡片图标默认用字符（W/AI/N 等），可在「管理 → 服务管理 → 编辑服务 → 图标」里改成任意 1-2 个字符（如 <b>AI</b>、<b>盾</b>），留空则自动取服务名首字。不用 emoji 也完全可以。</div>
</div>

<div class="toast" id="toast"></div>
<script>
function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.style.display='none'},2500)}
function api(path,opts){opts=opts||{};return fetch(path,opts).then(function(r){if(r.status===401){location.href='/login';throw new Error('unauthorized')}return r.json()})}
function cur(){return {bg_type:$('bg_type').value,bg_value:$('bg_value').value.trim(),bg_darkness:parseInt($('bg_dark').value,10),bg_blur:parseInt($('bg_blur').value,10)}}
function layerFor(c){var dk=c.bg_darkness,bl=c.bg_blur;var layer='';if(c.bg_type==='image'&&c.bg_value){layer='linear-gradient(rgba(10,16,32,'+(dk/100)+'),rgba(10,16,32,'+(dk/100)+')),url('+c.bg_value+') center/cover no-repeat';}else if(c.bg_type==='color'&&c.bg_value){layer=c.bg_value;}else if(c.bg_type==='light'){layer='linear-gradient(160deg,#eef2f9,#dde5f0)';}else{var lum=1-dk/130;layer='radial-gradient(900px 500px at 20% -10%,rgba(58,90,143,'+lum+') 0%,rgba(34,52,79,'+Math.max(0.2,lum-0.12)+') 55%),#22344f';}return {layer:layer,blur:bl}}
function preview(){var c=cur();var l=layerFor(c);var pv=$('pv');pv.style.setProperty('--pv',l.layer);pv.style.setProperty('--pv-blur',l.blur+'px')}
$('bg_type').onchange=function(){if(typeof toggleBg==='function')toggleBg();preview()};
$('up_btn').onclick=function(){$('bg_file').click()};
$('bg_file').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var fd=new FormData();fd.append('file',f);var st=$('bg_file_info');st.textContent='上传中…';fetch('/api/ui/upload',{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(d){if(d.error){st.textContent='上传失败: '+d.error;toast('上传失败: '+d.error)}else{$('bg_value').value=d.url;$('bg_type').value='image';if(typeof toggleBg==='function')toggleBg();preview();st.textContent='已上传 ✓ 点「保存外观」生效';toast('图片已上传，请保存')}}).catch(function(){st.textContent='上传失败';toast('上传失败')});this.value=''};
$('url_btn').onclick=function(){var u=$('bg_url').value.trim();if(!u){toast('请先粘贴图片链接');return}var st=$('bg_file_info');st.textContent='下载中…';fetch('/api/ui/url-bg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})}).then(function(r){return r.json()}).then(function(d){if(d.error){st.textContent='下载失败: '+d.error;toast('下载失败: '+d.error)}else{$('bg_value').value=d.url;$('bg_type').value='image';if(typeof toggleBg==='function')toggleBg();preview();st.textContent='已下载 ✓ 点「保存外观」生效';toast('图片已下载，请保存')}}).catch(function(){st.textContent='下载失败';toast('下载失败')})};
$('bg_dark').oninput=function(){$('dark_v').textContent=this.value;preview()};
$('bg_blur').oninput=function(){$('blur_v').textContent=this.value;preview()};
$('apply').onclick=function(){var c=cur();var l=layerFor(c);var b=document.body;b.classList.remove('light');if(c.bg_type==='light')b.classList.add('light');document.body.style.setProperty('--bg-layer',l.layer);document.body.style.setProperty('--bg-blur',l.blur+'px');toast('已预览（未保存）')};
$('save').onclick=function(){api('/api/ui',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cur())}).then(function(d){if(d.error){toast(d.error)}else{toast('外观已保存，刷新首页生效');preview()}})};
$('reset').onclick=function(){api('/api/ui',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bg_type:'gradient',bg_value:'',bg_darkness:55,bg_blur:0})}).then(function(){location.reload()})};
api('/api/ui').then(function(d){$('bg_type').value=d.bg_type||'gradient';$('bg_value').value=d.bg_value||'';if(d.bg_value&&d.bg_value.indexOf('#')===0){var bc=$('bg_color');if(bc)bc.value=d.bg_value;var bcv=$('bg_color_v');if(bcv)bcv.textContent=d.bg_value}if(d.bg_value&&d.bg_value.indexOf('/api/bg/')===0){$('bg_file_info').textContent='已上传背景图片'}if(d.bg_type==='color'&&!d.bg_value){var bc2=$('bg_color');if(bc2)bc2.value='#27406b';$('bg_value').value='#27406b'}$('bg_dark').value=(typeof d.bg_darkness==='number'?d.bg_darkness:55);$('dark_v').textContent=$('bg_dark').value;$('bg_blur').value=d.bg_blur||0;$('blur_v').textContent=$('bg_blur').value;if(typeof toggleBg==='function')toggleBg();preview()}).catch(function(){});
</script>
</body>
</html>
