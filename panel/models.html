<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>模型配置</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(1000px 500px at 20% -10%,#3a5a8f 0%,#22344f 60%),#22344f;background-attachment:fixed;color:#e2e8f0;max-width:760px;margin:0 auto;padding-bottom:24px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(13,20,36,.85);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
header a{color:#34d399;text-decoration:none;font-size:14px;white-space:nowrap}
header .tt{flex:1;font-size:16px;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px;margin:12px;backdrop-filter:blur(6px)}
.card h3{font-size:15px;color:#f1f5f9;margin-bottom:4px}
.subhint{font-size:11.5px;color:#7c8aa5;margin-bottom:6px}
label{display:block;font-size:12px;color:#94a3b8;margin:10px 0 4px}
input,select{width:100%;padding:9px;border:1px solid rgba(255,255,255,.15);border-radius:8px;font-size:14px;background:rgba(15,23,42,.6);color:#e2e8f0}
input::placeholder{color:#64748b}
.row{display:flex;gap:8px}
.row input{flex:1}
.row button{flex-shrink:0;padding:9px 14px;border:none;border-radius:8px;background:#3949AB;color:#fff;font-size:13px;cursor:pointer}
.mlist{margin-top:6px;max-height:160px;overflow-y:auto;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px;display:none}
.mlist label{display:block;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;margin:0;color:#cbd5e1}
.save{width:100%;margin-top:14px;padding:10px;border:none;border-radius:8px;background:#2e7d32;color:#fff;font-size:15px;cursor:pointer}
.hint{font-size:12px;color:#7c8aa5;margin-top:6px}
.toast{display:none;position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.12);color:#f1f5f9;padding:9px 18px;border-radius:22px;font-size:13px;z-index:99;max-width:82%}
</style>
</head>
<body>
<header>
<a href="/">← 返回</a>
<div class="tt">🧩 模型配置</div>
<button id="reload" style="background:rgba(255,255,255,.1);color:#cbd5e1;border:none;border-radius:14px;padding:6px 12px;font-size:12px;cursor:pointer">刷新</button>
</header>

<div class="card">
<h3>🤖 编码助手模型（Pi）</h3>
<div class="subhint">Pi 编码助手对话用的模型</div>
<label>服务商</label>
<select id="p_provider"><option value="glm">智谱 GLM</option><option value="deepseek">DeepSeek</option><option value="custom">自定义（OpenAI 兼容）</option></select>
<div id="p_base_wrap" style="display:none"><label>接口地址</label><input id="p_base" placeholder="如 https://api.openai.com/v1"></div>
<label>API Key</label><input id="p_key" type="password" placeholder="sk-...（留空保持不变）">
<label>模型</label>
<div class="row"><input id="p_model" placeholder="如 glm-4.5 / deepseek-chat"><button id="p_fetch">获取模型</button></div>
<div class="mlist" id="p_mlist"></div>
<button class="save" id="p_save">保存编码助手模型</button>
</div>

<div class="card">
<h3>📚 知识库向量模型（KB）</h3>
<div class="subhint">共享知识库向量化用的 Embedding 模型</div>
<label>服务商</label>
<select id="k_provider"><option value="zhipu">智谱 GLM</option><option value="dashscope">阿里百炼</option><option value="siliconflow">硅基流动</option><option value="custom">自定义（OpenAI 兼容）</option></select>
<div id="k_base_wrap" style="display:none"><label>接口地址</label><input id="k_base" placeholder="如 https://api.openai.com/v1"></div>
<label>API Key</label><input id="k_key" type="password" placeholder="sk-...（留空保持不变）">
<label>Embedding 模型</label>
<div class="row"><input id="k_model" placeholder="如 embedding-3 / text-embedding-v3"><button id="k_fetch">获取模型</button></div>
<div class="mlist" id="k_mlist"></div>
<button class="save" id="k_save">保存知识库模型</button>
</div>

<div class="toast" id="toast"></div>
<script>
function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.style.display='none'},2500)}
function api(path,opts){opts=opts||{};return fetch(path,opts).then(function(r){if(r.status===401){location.href='/login';throw new Error('unauthorized')}return r.json()})}
function toggleBase(){var p=$('p_provider').value;$('p_base_wrap').style.display=(p==='custom')?'block':'none';var k=$('k_provider').value;$('k_base_wrap').style.display=(k==='custom')?'block':'none'}
$('p_provider').onchange=toggleBase;$('k_provider').onchange=toggleBase;
function fillList(cont,arr,setfn){cont.innerHTML='';cont.style.display='block';(arr||[]).forEach(function(m){var lab=document.createElement('label');lab.textContent=m;lab.onclick=function(){Array.prototype.forEach.call(cont.children,function(x){x.style.background=''});lab.style.background='rgba(255,255,255,.12)';setfn(m)};cont.appendChild(lab)});if(!(arr||[]).length){cont.innerHTML='<label style="color:#7c8aa5">未返回模型，请手动填写</label>'}}
function fetchModels(btn,baseInput,keyInput,cont,setfn){var base=baseInput.value.trim();var key=keyInput.value.trim();if(!base||!key){toast('请填写接口地址和 API Key');return}btn.disabled=true;btn.textContent='获取中…';api('/api/models/fetch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_url:base,api_key:key})}).then(function(d){if(d.error){toast(d.error);return}fillList(cont,d.models||[],setfn)}).catch(function(e){toast('失败:'+e.message)}).finally(function(){btn.disabled=false;btn.textContent='获取模型'})}
$('p_fetch').onclick=function(){var base=$('p_base').value.trim()||'https://open.bigmodel.cn/api/paas/v4';if($('p_provider').value==='deepseek')base='https://api.deepseek.com/v1';fetchModels(this,{value:base},$('p_key'),$('p_mlist'),function(m){$('p_model').value=m})};
$('k_fetch').onclick=function(){var base=$('k_base').value.trim()||'https://open.bigmodel.cn/api/paas/v4';if($('k_provider').value==='dashscope')base='https://dashscope.aliyuncs.com/compatible-mode/v1';if($('k_provider').value==='siliconflow')base='https://api.siliconflow.cn/v1';fetchModels(this,{value:base},$('k_key'),$('k_mlist'),function(m){$('k_model').value=m})};
$('p_save').onclick=function(){var d={provider:$('p_provider').value,model:$('p_model').value.trim()};var k=$('p_key').value.trim();if(k)d.apiKey=k;if(d.provider==='custom')d.base_url=$('p_base').value.trim();api('/api/pi/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(d){if(d.error){toast(d.error)}else{toast('编码助手模型已保存')}})};
$('k_save').onclick=function(){var d={provider:$('k_provider').value,embedModel:$('k_model').value.trim()};var k=$('k_key').value.trim();if(k)d.apiKey=k;if(d.provider==='custom')d.embed_base=$('k_base').value.trim();api('/api/kb/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(d){if(d.error){toast(d.error)}else{toast('知识库模型已保存')}})};
function load(){api('/api/pi/config').then(function(d){$('p_provider').value=d.provider||'glm';$('p_base').value=d.base_url||'';$('p_model').value=d.model||'';$('p_key').placeholder=d.has_key?'已配置 Key，留空保持不变':'sk-...';toggleBase()});api('/api/kb/config').then(function(d){$('k_provider').value=d.provider||'zhipu';$('k_base').value=d.embed_base||'';$('k_model').value=d.embedModel||'';$('k_key').placeholder=d.has_key?'已配置 Key，留空保持不变':'sk-...';toggleBase()});}
$('reload').onclick=load;
load();
</script>
</body>
</html>
