<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>远程协助</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#1e293b;border-bottom:1px solid #334155}
header a{color:#38bdf8;text-decoration:none;font-size:14px;white-space:nowrap}
header .tt{flex:1;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;background:#0b1220;border-bottom:1px solid #1e293b}
.tips button{background:#1e293b;color:#7dd3fc;border:1px solid #334155;border-radius:10px;padding:4px 10px;font-size:12px;cursor:pointer}
.tips button:hover{background:#334155}
#out{flex:1;overflow-y:auto;padding:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.out-ok{color:#a5f3a5}
.out-err{color:#fca5a5}
.meta{color:#64748b;font-size:12px;margin:4px 0}
.blocked{color:#fbbf24;background:#451a03;border:1px solid #92400e;border-radius:8px;padding:8px 10px;margin:6px 0}
.inputbar{display:flex;gap:8px;padding:10px 14px;background:#1e293b;border-top:1px solid #334155;align-items:center}
.inputbar input{flex:1;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit}
.inputbar input:focus{outline:none;border-color:#38bdf8}
.inputbar select{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:9px;font-size:13px;font-family:inherit}
#goBtn{background:#0ea5e9;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;flex-shrink:0}
#goBtn:disabled{background:#475569;cursor:not-allowed}
.hist{position:absolute;right:14px;bottom:70px;background:#1e293b;border:1px solid #334155;border-radius:10px;max-height:200px;overflow-y:auto;display:none;width:340px;z-index:20}
.hist .h{font-size:12px;color:#94a3b8;padding:6px 10px;border-bottom:1px solid #334155;cursor:pointer}
.hist .h:hover{background:#334155}
.hist .c{color:#e2e8f0;font-size:12px;word-break:break-all}
.hist .s{color:#64748b;font-size:11px}
#histBtn{background:#334155;color:#94a3b8;border:none;border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header>
<a href="/">← 返回</a>
<div class="tt">🛟 远程协助</div>
<button id="histBtn">历史</button>
</header>
<div class="tips">
<button data-c="docker ps">docker ps</button>
<button data-c="docker ps -a --format 'table {{.Names}}\t{{.Status}}'">容器状态</button>
<button data-c="df -h">磁盘</button>
<button data-c="free -h">内存</button>
<button data-c="uptime">负载</button>
<button data-c="docker logs --tail 20 astrbot">AstrBot 日志</button>
</div>
<div id="out"><div class="meta">输入命令回车执行。危险操作会被安全策略拦截。输出限制 200KB，超时默认 60 秒。</div></div>
<div class="hist" id="hist"></div>
<div class="inputbar">
<input id="cmd" placeholder="输入要执行的命令，如 docker ps / df -h">
<select id="to"><option value="15">15s</option><option value="60" selected>60s</option><option value="120">120s</option><option value="300">300s</option></select>
<button id="goBtn">执行</button>
</div>
<script>
function $(id){return document.getElementById(id)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function append(type, text){
  var o=$('out');var d=document.createElement('div');d.className=type;d.textContent=text;o.appendChild(d);o.scrollTop=o.scrollHeight;
}
function meta(t){var o=$('out');var d=document.createElement('div');d.className='meta';d.textContent=t;o.appendChild(d);o.scrollTop=o.scrollHeight}
function run(){
  var v=$('cmd').value.trim();
  if(!v)return;
  if(/rm\s+-(rf|fr)\s+\/|mkfs|shutdown|reboot|poweroff|halt|fdisk|parted/.test(v)){
    if(!confirm('该命令可能造成系统级破坏，确认执行？'))return;
  }
  var btn=$('goBtn');btn.disabled=true;btn.textContent='执行中…';
  meta('$ ' + v);
  fetch('/api/remote/exec',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:v,timeout:parseInt($('to').value||'60',10)})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.error){append('blocked', d.error);return}
    if(d.timed_out){meta('⏱ 已超时，进程已终止（' + d.elapsed + 's）')}
    if(d.stdout){append('out-ok', d.stdout)}
    if(d.stderr){append('out-err', d.stderr)}
    meta('exit=' + d.exit_code + ' · ' + d.elapsed + 's' + (d.truncated?' · 输出已截断':''));
  }).catch(function(e){append('out-err','请求失败：'+e.message)}).finally(function(){btn.disabled=false;btn.textContent='执行'})
}
$('goBtn').onclick=run;
$('cmd').addEventListener('keydown',function(e){if(e.key==='Enter')run()});
document.querySelectorAll('.tips button').forEach(function(b){b.onclick=function(){$('cmd').value=b.dataset.c;run()}});
$('histBtn').onclick=function(){var h=$('hist');if(h.style.display==='block'){h.style.display='none';return}fetch('/api/remote/history').then(function(r){return r.json()}).then(function(d){
  h.innerHTML='';
  var evs=d.events||[];
  if(!evs.length){h.innerHTML='<div class="h">暂无历史</div>'}else{
  evs.slice().reverse().forEach(function(line){
    var m=line.match(/exec(_BLOCKED)? cmd=(.+) code=([0-9-]+)/);
    if(!m)return;
    var div=document.createElement('div');div.className='h';
    div.innerHTML='<div class="c">'+(m[1]?'[拦截] ':'')+esc(m[2])+'</div><div class="s">'+esc(line.split(' ')[0])+' · exit '+(m[1]?'-':m[3])+'</div>';
    div.onclick=function(){if(!m[1]){$('cmd').value=m[2].replace(/\"/g,'')}h.style.display='none'};
    h.appendChild(div);
  });}
  h.style.display='block';
}).catch(function(){})};
document.addEventListener('click',function(e){if(!e.target.closest('#hist')&&!e.target.closest('#histBtn')){$('hist').style.display='none'}});
</script>
</body>
</html>
